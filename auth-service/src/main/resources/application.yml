server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306//authdb?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:Khush@3105Kot}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  # Flyway is available; add migrations under classpath:db/migration when ready.
  flyway:
    enabled: false
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
app:
  jwt:
    # Override with APP_JWT_SECRET in deployed environments.
    secret: ${APP_JWT_SECRET:change-this-development-secret-to-a-long-random-value}
