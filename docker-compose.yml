services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports: ["8761:8761"]
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports: ["8080:8080"]
    depends_on: [eureka-server]
    environment:
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports: ["8081:8081"]
    depends_on: [eureka-server]
    environment:
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  regret-service:
    build:
      context: .
      dockerfile: regret-service/Dockerfile
    ports: ["8082:8082"]
    depends_on: [eureka-server, python-chain-service]
    environment:
      SPRING_EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CHAIN_SERVICE_URL: http://python-chain-service:8000
  python-chain-service:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./python-chain-service:/app"]
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
